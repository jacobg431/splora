<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Splora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="header">
        <span id="run-name">Splora</span>
        <div id="header-meta">
            <span id="meta-root"></span>
            <span class="sep">·</span>
            <span id="meta-files"></span>
            <span class="sep">·</span>
            <span id="meta-size"></span>
            <span id="meta-partial" class="badge-warning hidden">Partial scan</span>
        </div>
    </header>

    <div id="layout">
        <aside id="tree-panel">
            <div id="tree-root"></div>
        </aside>

        <div id="right-panel">
            <div id="treemap-container"></div>

            <div id="info-panel">
                <div id="info-summary">
                    <div id="info-name"></div>
                    <div id="info-path"></div>
                    <div id="info-stats">
                        <div class="stat">
                            <div class="stat-label">Total size</div>
                            <div id="stat-size" class="stat-value">—</div>
                        </div>
                        <div class="stat">
                            <div class="stat-label">Files</div>
                            <div id="stat-count" class="stat-value">—</div>
                        </div>
                    </div>
                </div>
                <div id="info-charts">
                    <div id="chart-ext"></div>
                    <div id="chart-cat"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="vendor/echarts.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
