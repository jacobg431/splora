<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Splora</title>
    <link rel="stylesheet" href="vendor/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex flex-column overflow-hidden">

    <header id="header" class="d-flex align-items-center justify-content-between px-3 flex-shrink-0">
        <span id="run-name" class="fw-semibold text-truncate me-3">Splora</span>
        <div id="header-meta" class="d-flex align-items-center gap-2 flex-shrink-0 text-nowrap">
            <span id="meta-root"></span>
            <span class="opacity-50">·</span>
            <span id="meta-files"></span>
            <span class="opacity-50">·</span>
            <span id="meta-size"></span>
            <span id="meta-partial" class="badge bg-warning text-dark ms-1 hidden">Partial scan</span>
        </div>
    </header>

    <!-- CSS Grid layout — cells are tree-panel, treemap-container, charts-panel, summary-panel.
         The grid template changes at 1024 px; see style.css for both breakpoints. -->
    <div id="layout">

        <aside id="tree-panel" class="overflow-y-auto">
            <div id="tree-root"></div>
        </aside>

        <div id="treemap-container"></div>

        <!-- ≥ 1024 px: stacked vertically right of treemap.
             <  1024 px: side-by-side below the treemap. -->
        <div id="charts-panel" class="bg-white">
            <div id="chart-ext"></div>
            <div id="chart-cat"></div>
        </div>

        <!-- ≥ 1024 px: full-width row below the top section, cards laid out horizontally.
             <  1024 px: left column below the folder tree, cards stacked vertically. -->
        <div id="summary-panel" class="bg-white py-2 gap-4">
            <div class="card info-card w-160">
                <div class="card-body py-2 px-3">
                    <div id="info-name" class="fw-semibold text-truncate"></div>
                    <div id="info-path" class="text-muted font-monospace text-truncate small mt-1"></div>
                </div>
            </div>
            <div class="card stat-card w-160">
                <div class="card-body py-2 px-3 text-center">
                    <div class="stat-label text-muted text-uppercase">Total size</div>
                    <div id="stat-size" class="stat-value fw-bold">—</div>
                </div>
            </div>
            <div class="card stat-card w-160">
                <div class="card-body py-2 px-3 text-center">
                    <div class="stat-label text-muted text-uppercase">Files</div>
                    <div id="stat-count" class="stat-value fw-bold">—</div>
                </div>
            </div>
        </div>

    </div>

    <script src="vendor/echarts.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
