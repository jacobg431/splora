[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "splora"
version = "0.1.0"
description = "A locally hosted, cross-platform file system data visualization tool"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Jacob Gomez Hansen" },
    { name = "Claude Sonnet 4.6" },
]
dependencies = []

[project.scripts]
splora = "splora:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "mypy>=1.15",
]

[tool.setuptools]
py-modules = ["splora"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.mypy]
python_version = "3.13"
strict = true
